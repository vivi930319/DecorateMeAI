<div class="page-header">
    <h1>妝容對比圖</h1>
    <div class="divider"></div>
</div>

<div class="journey-dialog-shell render-dialog-shell"><button class="journey-dialog-close" type="button" aria-label="關閉" onclick="Router.go('suggestion')">×</button>
<div class="compare-layout">
    <div class="compare-preview" id="comparePreview">
        <div class="ph compare-stage before" id="compareStage"></div>
        <button class="compare-hold-btn" id="compareHoldBtn">按住對比</button>
    </div>

    <div class="analysis-section">
        <h3>目前風格</h3>
        <p id="compareStyleName">尚未選擇風格</p>
        <div class="analysis-tags" id="compareStyleTags"></div>
        <button class="btn-outline" id="compareGoStyleBtn">選擇風格</button>
        <!-- 2026-08-28 拿掉「生成妝容」與它的兩個狀態列：JS 從來沒有接過這三個 id
             （grep 全部 js 檔為 0 處），所以那顆按鈕按下去不會有任何事。
             渲染的入口在妝容建議頁，渲染完會自動跳來這裡，這頁不需要再有一個。
             按不動的按鈕比沒有按鈕更糟——使用者會按它，然後以為自己已經做了。 -->
        <div style="margin-top:10px;">
            <div style="font-size:11px;color:#999;margin-bottom:4px;letter-spacing:.05em;">英文渲染指令（後端實際使用）</div>
            <div id="comparePromptPreview" style="display:none;font-size:11px;color:#7a6060;background:rgba(255,248,244,0.85);border:1px solid #e8d5c8;border-radius:8px;padding:10px 12px;line-height:1.6;word-break:break-word;"></div>
        </div>
        <button class="btn-outline" id="compareSaveLookBtn" style="margin-top:8px;">收藏妝容對比圖</button>
    </div>
</div>
</div>
