<div class="page-header"><span class="eyebrow">Member</span><h1>會員中心</h1><div class="divider"></div></div>
<div class="member-wrap">
    <div class="member-id">
        <div class="member-avatar" id="profileAvatar">✦</div>
        <div class="member-name" id="profileName">訪客</div>
        <div class="member-role">Decorate Me Member</div>
        <div class="member-actions">
            <button class="btn-outline" id="changePwdBtn" style="display:none;">更改密碼</button>
            <button class="btn-outline member-logout" onclick="Auth.logout()">登出帳號</button>
        </div>
    </div>
    <div class="member-stats">
        <div class="stat-cell">
            <div class="stat-en">Wishlist</div>
            <div class="stat-num" id="profileFavCount">0</div>
            <div class="stat-label">收藏商品</div>
        </div>
        <div class="stat-cell">
            <div class="stat-en">Analysis</div>
            <div class="stat-num" id="profileAnalyzeCount">0</div>
            <div class="stat-label">分析次數</div>
        </div>
        <div class="stat-cell">
            <div class="stat-en">Looks</div>
            <div class="stat-num" id="profileSuggestionCount">0</div>
            <div class="stat-label">收藏妝容</div>
        </div>
        <div class="stat-cell stat-link" data-nav="analysis">
            <div class="stat-en">Start</div>
            <div class="stat-mark">＋</div>
            <div class="stat-label">開始新分析</div>
        </div>
    </div>
</div>

<section class="member-suggestions">
    <div class="member-section-head">
        <span>Saved Looks</span>
        <h2>已收藏的妝容對比圖</h2>
    </div>
    <div id="profileSuggestionArea"></div>
</section>
