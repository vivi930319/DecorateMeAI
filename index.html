<script>
(function(){
    try {
        if (sessionStorage.getItem('introShown')) document.documentElement.classList.add('intro-off');
        else sessionStorage.setItem('introShown', '1');
    } catch (_) {}
})();
</script>
<noscript><style>#brand-intro{display:none!important}</style></noscript>

<body>

<!-- ═══ 進場動畫（金箔光澤橫掃揭曉品牌） ═══ -->
<div id="brand-intro" data-screen-label="進場" aria-hidden="true">
    <div class="intro-haze"></div>
    <div class="intro-name">
        <span class="ch">裝</span><span class="ch">識</span><span class="ch">你</span><span class="ch">的</span><span class="ch">美</span>
        <div class="intro-mask"></div>
    </div>
    <div class="intro-glint"></div>
    <div class="intro-rule"></div>
    <div class="intro-sub">Decorate Me · Beauty Atelier</div>
    <div class="intro-skip">點擊或按 ESC 跳過</div>
</div>

<!-- ═══ 登入頁（未登入時顯示） ═══ -->
<div id="auth-layer"></div>

<!-- ═══ 主框架（登入後顯示） ═══ -->
<div id="app" class="app-shell" style="display:none;">
    <!-- 品牌浮水印：字樣層在最底，訊號層跟著游標走，右下角是固定的識別章。
         三層都不吃點擊事件，只有視覺。 -->
    <div class="brand-watermark" aria-hidden="true"></div>
    <div class="signal-watermark" aria-hidden="true"></div>
    <div class="cursor-glow" id="cursorGlow"></div>
    <header class="topbar">
        <div class="topbar-inner">
            <div class="topbar-brand" onclick="Router.go('dashboard')">
                <span class="brand-round-mark" aria-hidden="true"><img src="assets/brand/decorate-me-round-source.jpg" alt=""></span>
                <span class="topbar-brand-copy">
                    <span class="sb-name">裝識你的美</span>
                    <span class="sb-sub">DECORATE ME</span>
                </span>
            </div>
            <nav class="topbar-nav" id="topbarDrawer" aria-label="主要選單">
                <a href="#dashboard" data-page="dashboard" class="active">首頁</a>
                <a href="#analysis" data-page="analysis">臉部分析</a>
                <a href="#products" data-page="products">商品推薦</a>
                <a href="#favorites" data-page="favorites">收藏</a>
                <a href="#history" data-page="history">分析紀錄</a>
                <a href="#suggestion" data-page="suggestion">妝容建議</a>
                <a href="#profile" data-page="profile">會員中心</a>
                <a href="#admin" data-page="admin" data-admin-link style="display:none;">管理中台</a>
            </nav>
            <button class="topbar-menu-backdrop" type="button" aria-label="關閉選單" onclick="closeTopbarMenu()"></button>
            <div class="topbar-right">
                <button type="button" class="topbar-cart" onclick="showCartPanel()" aria-label="購物車">
                    <span class="cart-symbol" aria-hidden="true">🛒</span>
                    <span class="cart-count" id="cartCount">0</span>
                </button>
                <button type="button" class="topbar-user" data-page="profile" onclick="Router.go('profile');">
                    <span class="tu-icon">✦</span>
                    <span id="sidebarUsername">訪客</span>
                </button>
                <button class="topbar-logout" onclick="Auth.logout()" aria-label="登出">登出</button>
                <button class="topbar-menu-toggle" type="button" aria-label="開啟選單" aria-expanded="false" aria-controls="topbarDrawer" onclick="toggleTopbarMenu()"><span></span><span></span><span></span></button>
            </div>
        </div>
        <div class="gold-stream"></div>
    </header>
    <main class="main-content" id="mainContent">
        <!-- 動態載入頁面內容 -->
    </main>
</div>

<script>
// 進場動畫：同一分頁只播一次，並尊重系統的「減少動態」設定。
function toggleTopbarMenu(){
    var nav=document.getElementById('topbarDrawer'),btn=document.querySelector('.topbar-menu-toggle');
    var open=!document.body.classList.contains('menu-open');
    document.body.classList.toggle('menu-open',open);
    if(btn){btn.setAttribute('aria-expanded',String(open));btn.setAttribute('aria-label',open?'關閉選單':'開啟選單');}
    if(open) nav?.querySelector('a')?.focus();
}
function closeTopbarMenu(){document.body.classList.remove('menu-open');var btn=document.querySelector('.topbar-menu-toggle');if(btn){btn.setAttribute('aria-expanded','false');btn.setAttribute('aria-label','開啟選單');}}
document.addEventListener('click',function(e){if(e.target.closest&&e.target.closest('#topbarDrawer a'))setTimeout(closeTopbarMenu,0);});
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&document.body.classList.contains('menu-open')){closeTopbarMenu();document.querySelector('.topbar-menu-toggle')?.focus();}});
(function(){
    var intro = document.getElementById('brand-intro');
    if (!intro) return;
    if (document.documentElement.classList.contains('intro-off')) { intro.remove(); return; }
    var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    var DUR = reduce ? 900 : 3400;
    var OUT = reduce ? 0 : 1100;
    var timer, dismissed = false;
    function dismiss(){
        if (dismissed) return;
        dismissed = true;
        clearTimeout(timer);
        document.removeEventListener('keydown', onKey);
        intro.classList.add('done');
        setTimeout(function(){ intro.remove(); }, OUT);
    }
    function onKey(event){ if (event.key === 'Escape' || event.key === 'Enter' || event.key === ' ') dismiss(); }
    timer = setTimeout(dismiss, DUR);
    intro.addEventListener('click', dismiss);
    document.addEventListener('keydown', onKey);
})();

// 滑鼠裝置顯示金色光暈。
// 原本這裡還有一圈 230px 的金色錐形漸層跟著游標永遠旋轉（.gold-cursor-flow）。
// 它不表示任何事情——不是載入中、不是進度，什麼都不是——卻一直在動，
// 而畫面上一直在動的東西會被讀成「還在跑」。留下不會轉的柔光就好。
(function(){
    // 觸控裝置沒有固定游標，因此不啟用這個效果。
    var fine = window.matchMedia && window.matchMedia('(hover: hover) and (pointer: fine)').matches;
    if (!fine) return;

    var glow = null, root = document.documentElement;
    var x = 0, y = 0, queued = false;
    // 每個畫面更新一次座標，減少重複重算樣式。
    function paint(){
        queued = false;
        root.style.setProperty('--wm-x', x + 'px');
        root.style.setProperty('--wm-y', y + 'px');
        if (glow) { glow.style.left = x + 'px'; glow.style.top = y + 'px'; glow.style.opacity = '1'; }
    }
    document.addEventListener('mousemove', function(e){
        glow = glow || document.getElementById('cursorGlow');
        x = e.clientX; y = e.clientY;
        if (!queued) { queued = true; requestAnimationFrame(paint); }
    }, { passive: true });
    document.addEventListener('mouseleave', function(){
        if (glow) glow.style.opacity = '0';
    }, { passive: true });
})();
</script>
<script defer src="js/config.js?v=20260828-225627"></script>
<script>
// config.local.js 只存在於開發機：firebase.json 明確把它排除在部署之外（它是本機覆寫用的，
// 而且 deploy.ps1 會斷言這件事，因為那個檔案可能含有不該公開的設定）。
//
// 但先前是用靜態 <script src="config.local.js"> 載它，於是**正式站每一位訪客**都會拿到：
//     GET /config.local.js  404
//     Refused to execute script ... MIME type ('text/html') is not executable
// 第二則是因為 Firebase Hosting 對未知路徑回的是 index.html（HTML，不是 JS）。
// 那個 onerror="void 0" 擋不住這兩則——它們是網路層與 MIME 檢查印的，不是 script 的
// error 事件。結果是 console 永遠有兩行紅字，真正的錯誤會被埋在裡面。
//
// 改成只在本機注入。async=false 讓它維持插入順序，在開發機上會早於 api.js 讀設定；
// 正式站則完全不會發出這個請求。
(function () {
    var host = location.hostname;
    if (host !== 'localhost' && host !== '127.0.0.1' && location.protocol !== 'file:') return;
    var local = document.createElement('script');
    local.src = 'config.local.js';
    local.async = false;
    document.currentScript.parentNode.insertBefore(local, document.currentScript.nextSibling);
})();
</script>
