<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>裝識你的美 · DECORATE ME</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Noto+Serif+TC:wght@300;400;500;700&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/main.css?v=20260626-advice-cards">
</head>
<body>

<!-- ═══ 進場動畫（金箔光澤橫掃揭曉品牌） ═══ -->
<div id="brand-intro" data-screen-label="進場">
    <div class="intro-haze"></div>
    <div class="intro-name">
        <span class="ch">裝</span><span class="ch">識</span><span class="ch">你</span><span class="ch">的</span><span class="ch">美</span>
        <div class="intro-mask"></div>
    </div>
    <div class="intro-glint"></div>
    <div class="intro-rule"></div>
    <div class="intro-sub">Decorate Me · Beauty Atelier</div>
</div>

<!-- ═══ 登入頁（未登入時顯示） ═══ -->
<div id="auth-layer"></div>

<!-- ═══ 主框架（登入後顯示） ═══ -->
<div id="app" class="app-shell" style="display:none;">
    <div class="cursor-glow" id="cursorGlow"></div>
    <header class="topbar">
        <div class="topbar-inner">
            <div class="topbar-brand" onclick="Router.go('dashboard')">
                <div class="sb-name">裝識你的美</div>
                <div class="sb-sub">DECORATE ME</div>
            </div>
            <nav class="topbar-nav">
                <a href="#dashboard" data-page="dashboard" class="active">首頁</a>
                <a href="#analysis" data-page="analysis">臉部分析</a>
                <a href="#style" data-page="style">風格試妝</a>
                <a href="#products" data-page="products">商品推薦</a>
                <a href="#favorites" data-page="favorites">收藏</a>
                <a href="#history" data-page="history">分析紀錄</a>
                <a href="#compare" data-page="compare">妝容對比圖</a>
                <a href="#suggestion" data-page="suggestion">妝容建議</a>
                <a href="#profile" data-page="profile">會員中心</a>
                <a href="#admin" data-page="admin" data-admin-link style="display:none;">管理中台</a>
            </nav>
            <div class="topbar-right">
                <button type="button" class="topbar-cart" onclick="showCartPanel()" aria-label="購物車">
                    <span class="cart-symbol" aria-hidden="true">🛒</span>
                    <span class="cart-count" id="cartCount">0</span>
                </button>
                <button type="button" class="topbar-user" data-page="profile" onclick="Router.go('profile');">
                    <span class="tu-icon">✦</span>
                    <span id="sidebarUsername">訪客</span>
                </button>
                <button class="topbar-logout" onclick="Auth.logout()" aria-label="登出">登出</button>
            </div>
        </div>
        <div class="gold-stream"></div>
    </header>
    <main class="main-content" id="mainContent">
        <!-- 動態載入頁面內容 -->
    </main>
</div>

<script>
// 進場動畫：播放一次後揭曉（每次重整都會播，可改成 sessionStorage 只播一次）
(function(){
    var intro = document.getElementById('brand-intro');
    if (!intro) return;
    // 同一個瀏覽器分頁 session 只播一次；之後重整直接跳過（demo/開發一直重整不用每次等 3.4 秒）
    try {
        if (sessionStorage.getItem('introShown')) { intro.style.display = 'none'; return; }
        sessionStorage.setItem('introShown', '1');
    } catch (_) {}
    var DUR = 3400;
    setTimeout(function(){
        intro.classList.add('done');
        setTimeout(function(){ intro.style.display = 'none'; }, 1100);
    }, DUR);
    // 點擊可跳過
    intro.addEventListener('click', function(){
        intro.classList.add('done');
        setTimeout(function(){ intro.style.display = 'none'; }, 700);
    });
})();

// 游標跟隨的金色光暈
(function(){
    var glow = null;
    document.addEventListener('mousemove', function(e){
        glow = glow || document.getElementById('cursorGlow');
        if (!glow) return;
        glow.style.left = e.clientX + 'px';
        glow.style.top = e.clientY + 'px';
        glow.style.opacity = '1';
    });
    document.addEventListener('mouseleave', function(){ if(glow) glow.style.opacity = '0'; });
})();
</script>
<script defer src="js/config.js?v=20260711-144818"></script>
<script defer src="config.local.js?v=20260711-144818" onerror="void 0"></script>
<script defer src="js/data.js?v=20260711-144818"></script>
<script defer src="js/api.js?v=20260711-144818"></script>
<script defer src="js/router.js?v=20260711-144818"></script>
</body>
</html>
