<!doctype html>
<html lang="zh-Hant">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}會員系統{% endblock %}</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
    <div class="container">
        <a class="navbar-brand" href="{{ url_for('index') }}">會員系統</a>
        <div class="d-flex gap-2">
            <a class="btn btn-sm btn-outline-light" href="{{ url_for('products_page') }}">商品瀏覽</a>
            {% if current_user.is_authenticated %}
                <a class="btn btn-sm btn-outline-light" href="{{ url_for('profile') }}">會員中心</a>
                <a class="btn btn-sm btn-warning" href="{{ url_for('logout') }}">登出</a>
            {% else %}
                <a class="btn btn-sm btn-outline-light" href="{{ url_for('login') }}">登入</a>
                <a class="btn btn-sm btn-success" href="{{ url_for('register') }}">註冊</a>
            {% endif %}
        </div>
    </div>
</nav>
<main class="container">
    {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            {% for category, message in messages %}
                <div class="alert alert-{{ category }} alert-dismissible fade show" role="alert">
                    {{ message }}
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>
            {% endfor %}
        {% endif %}
    {% endwith %}

    {% block content %}{% endblock %}
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
