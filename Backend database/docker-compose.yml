services:
  app:
    build: .
    container_name: empower-beauty-api
    ports:
      # Port 5000 is reserved for the current Windows product/member service.
      # Binding this legacy container to localhost:5000 also claimed IPv6 ::1,
      # causing cloudflared's `localhost:5000` origin to serve the stale catalog.
      - "127.0.0.1:${LEGACY_APP_PORT_PUBLISHED:-5001}:5000"
    environment:
      FLASK_DEBUG: "0"
      PORT: "5000"
      SECRET_KEY: "${SECRET_KEY:-change-me-in-production}"
      DB_HOST: db
      DB_PORT: "5432"
      DB_USER: "${DB_USER:-postgres}"
      DB_PASSWORD: "${DB_PASSWORD:-postgres}"
      DB_NAME: "${DB_NAME:-empower_beauty}"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ""
      OTP_EXPIRE_SECONDS: "${OTP_EXPIRE_SECONDS:-300}"
      OTP_SEND_WINDOW_SECONDS: "${OTP_SEND_WINDOW_SECONDS:-900}"
      OTP_SEND_MAX_ATTEMPTS: "${OTP_SEND_MAX_ATTEMPTS:-5}"
      USD_TO_TWD_RATE: "${USD_TO_TWD_RATE:-31.685}"
      USD_TO_TWD_RATE_AS_OF: "${USD_TO_TWD_RATE_AS_OF:-2026-08-30T09:25:00+08:00}"
      SMTP_USER: "${SMTP_USER:-}"
      SMTP_PASS: "${SMTP_PASS:-}"
      # The current Gateway does not attach X-Gateway-Key to member auth calls.
      # Turn this off only after Gateway has been deployed with that header.
      # 管理員的 DELETE／PATCH 委派必須有這把金鑰。禁止以空值啟動，避免
      # 後台可讀取資料但所有管理寫入都失敗。
      UPSTREAM_MEMBER_API_KEY: "${UPSTREAM_MEMBER_API_KEY:?請使用 scripts/start-member-service.ps1 從 Secret Manager 啟動服務}"
      GATEWAY_KEY_LOOSE_MODE: "${GATEWAY_KEY_LOOSE_MODE:-true}"
      SAVED_LOOK_LIMIT: "${SAVED_LOOK_LIMIT:-100}"
      MEMBER_SESSION_TTL_SECONDS: "${MEMBER_SESSION_TTL_SECONDS:-28800}"
      OLLAMA_HOST: "${OLLAMA_HOST:-}"
      SD_HOST: "${SD_HOST:-}"
    depends_on:
      - db
      - redis
    volumes:
      - uploads:/app/static/uploads
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  db:
    image: postgres:18-alpine
    container_name: empower-beauty-db
    environment:
      POSTGRES_USER: "${DB_USER:-postgres}"
      POSTGRES_PASSWORD: "${DB_PASSWORD:-postgres}"
      POSTGRES_DB: "${DB_NAME:-empower_beauty}"
    ports:
      # Windows PostgreSQL already owns host port 5432. Publishing this second
      # cluster on the same port made the two member stores look interchangeable.
      # Port 5433 is the single canonical database endpoint for host-side tools.
      - "${DB_PORT_PUBLISHED:-5433}:5432"
    volumes:
      # PostgreSQL 18 stores clusters in versioned subdirectories; mount its
      # parent directory rather than the legacy /data directory.
      - postgres18_data:/var/lib/postgresql
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-empower_beauty}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: empower-beauty-redis
    ports:
      - "${REDIS_PORT_PUBLISHED:-6379}:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  # Keep the PostgreSQL 16 volume untouched as a rollback backup.
  postgres18_data:
  redis_data:
  uploads:
