# 本機容器版的前端伺服器。
#
# 這份設定的唯一目的，是讓「本機用 Docker 跑」跟「線上 Firebase Hosting」走同一條路徑：
# 線上的 firebase.json 用 rewrites 把 /face-basic/** 這類路徑導到 Cloud Run 的 ai-gateway，
# 對瀏覽器來說是**同源**請求；這裡用 proxy_pass 做同一件事。
#
# 為什麼一定要同源、不能讓前端直接打 http://localhost:8015：
# gateway 的登入狀態是 Cookie。跨源 + credentials 的 Cookie 會受 SameSite 限制，
# 本機能不能過完全取決於瀏覽器版本與 Secure 屬性——那會變成「本機測得過、線上掛掉」
# 或反過來的假訊號。同源 proxy 讓兩邊的 Cookie 行為一致。

upstream ai_gateway_upstream {
    # gateway 跑在後端那份 compose（PythonProject12/docker-compose.yml），
    # 對外映射 8015。兩份 compose 各自獨立，所以用 host 迴路連過去而不是服務名。
    server host.docker.internal:8015;
}

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 前端會上傳照片做臉部分析。gateway 的 AI_GATEWAY_MAX_BODY_BYTES 預設 13MB，
    # 而 nginx 預設只放行 1MB —— 不改這行，照片一上傳就是 413，而且錯誤發生在
    # nginx 這層，gateway 的 log 完全看不到，會很難查。
    client_max_body_size 20m;

    # 臉部分析是同步等待的長請求（gateway 對 face 上游的 timeout 是 120 秒）。
    # nginx 預設 proxy_read_timeout 60 秒，會在 gateway 還在等的時候先回 504。
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    # ── Gateway 路徑 ────────────────────────────────────────────────────────
    # 這份清單必須與 firebase.json 的 rewrites 逐條對應。少一條，該功能在本機
    # 會拿到 index.html（try_files 的 fallback）而不是 JSON，前端會在解析時炸掉，
    # 而錯誤訊息看起來完全不像「路由沒設定」。
    #
    # /public-config 是精確路徑（沒有子路徑），其餘都是前綴，所以用 (/|$) 同時涵蓋。
    location ~ ^/(public-config|auth|guest|admin-api|face-basic|face-pro|text-suggestion|render-service|member-database|product-api|media)(/|$) {
        proxy_pass http://ai_gateway_upstream;
        proxy_http_version 1.1;

        # gateway 會依 Host 決定 Cookie 的作用域，這裡必須傳真實的 Host
        # （localhost:8080），不能讓它看到 upstream 的名字。
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 登入狀態靠 Cookie，兩個方向都要原樣通過。
        proxy_set_header Cookie $http_cookie;
        proxy_pass_header Set-Cookie;

        # 上游沒起來時不要讓 nginx 自己吞掉錯誤頁，把 gateway 的 JSON 錯誤原樣回給前端。
        proxy_intercept_errors off;
    }

    # ── 靜態檔 ──────────────────────────────────────────────────────────────
    # 前端是 SPA 風格的多頁結構，未知路徑回 index.html 由 router.js 接手，
    # 與 Firebase Hosting 的預設行為一致。
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 開發用容器不快取，避免改了檔案重新 build 後瀏覽器還吃舊版
    # （OneDrive 同步延遲已經夠讓人懷疑人生了，不需要再多一層快取）。
    location ~* \.(js|css|html)$ {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        expires -1;
    }
}
