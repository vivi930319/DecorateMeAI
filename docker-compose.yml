services:
  face_analysis_basic:
    build: .
    container_name: face_analysis_basic
    ports:
      - "8001:8001"
    environment:
      - MAX_IMAGE_SIZE=2048
      - FACE_JOB_TIMEOUT_SECONDS=180
      - FACE_JOB_RETENTION_SECONDS=3600
      - FACE_JOB_MAX_COUNT=200
    volumes:
      - ./eyelid_model.onnx:/app/eyelid_model.onnx:ro
      - ./eyelid_model.onnx.data:/app/eyelid_model.onnx.data:ro
    command: ["uvicorn", "Face_analyzer_BASIC:app", "--host", "0.0.0.0", "--port", "8001"]
    restart: always

  face_analysis_pro:
    build: .
    container_name: face_analysis_pro
    ports:
      - "8002:8002"
    environment:
      - MAX_IMAGE_SIZE=2048
      - FACE_JOB_TIMEOUT_SECONDS=180
      - FACE_JOB_RETENTION_SECONDS=3600
      - FACE_JOB_MAX_COUNT=200
    volumes:
      - ./eyelid_model.onnx:/app/eyelid_model.onnx:ro
      - ./eyelid_model.onnx.data:/app/eyelid_model.onnx.data:ro
    command: ["uvicorn", "Face_analyzer_PRO:app", "--host", "0.0.0.0", "--port", "8002"]
    restart: always

  ollama_suggestion:
    build: .
    container_name: ollama_suggestion
    ports:
      - "8010:8010"
    environment:
      # 連接黃姵錚的 Mac Ollama（透過 Cloudflare Tunnel）
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-gemma3}
    command: ["uvicorn", "Ollama_suggestion:app", "--host", "0.0.0.0", "--port", "8010"]
    restart: always

  replicate_render:
    profiles: ["optional"]
    build: .
    container_name: replicate_render
    ports:
      - "8020:8020"
    environment:
      - REPLICATE_API_TOKEN=${REPLICATE_API_TOKEN}
    command: ["uvicorn", "replicate_render:app", "--host", "0.0.0.0", "--port", "8020"]
    restart: always
    # 組員尚未交付 replicate_render.py 前，不會隨預設 docker compose up 啟動
