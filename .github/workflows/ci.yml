name: CI

# 最小 CI：每次 push / PR 都跑後端測試與一次秘密掃描，擋掉資安修補被改回去的回歸。
# 前端在同一個 repo 的 dev_makeup 分支，其 node 檢查與 smoke test 在該分支自跑。
#
# 2026-08-23 的重構把原始碼分進 face/ gateway/ render/ shared/ suggestion/，
# 但這份設定還在找根目錄的 ai_gateway.py 與 requirements.gateway.txt，於是
# 五個 job 全部在幾秒內死掉，一路紅到 08-26 才被看見。教訓寫在下面兩處：
# 相依清單指到各服務資料夾，lint 改成掃**資料夾**而不是逐檔列名——
# 逐檔列名的清單每次搬檔都會壞，而且壞掉的樣子是「找不到檔案」，
# 看起來像設定錯誤而不是程式有問題，很容易被當成雜訊略過。
on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pinned dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest
          pip install -r gateway/requirements.txt -r render/requirements.txt

      - name: Run backend tests
        env:
          GATEWAY_SESSION_SECRET: ci-session-secret-that-is-at-least-32-bytes
          GATEWAY_FACE_API_KEY: ci-face-key
          GATEWAY_RENDER_API_KEY: ci-render-key
        # 用 pytest 而不是 unittest：容器內的命名空間是扁平的
        # （Dockerfile 用 COPY gateway/x.py .），所以程式裡寫的是 `import job_store`。
        # pytest.ini 的 pythonpath 那行就是在重現那個扁平命名空間，
        # 而 `python -m unittest` 不會讀 pytest.ini，換句話說它根本組不出正確的 sys.path。
        run: python -m pytest tests/ai_gateway_test.py tests/render_api_test.py tests/image_safety_test.py

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # 只挑「會壞掉」的規則，不做風格檢查：語法錯誤、用到不存在的名字、
      # 永遠為真的比較、沒用到的 import 與區域變數。風格意見進 CI 只會製造噪音，
      # 讓大家習慣性忽略紅燈——那比沒有 lint 更糟。
      - name: Lint deployable modules
        run: |
          python -m pip install --upgrade pip ruff
          ruff check --select E9,F63,F7,F82,F401,F841 --output-format concise \
            face gateway render shared suggestion tests

      # 型別檢查是諮詢性的：這份程式從來沒有標註過型別，一次要求全綠等於要求
      # 停下所有功能開發。先讓它跑起來、看得到報告，之後再逐檔收斂。
      - name: Type check (advisory)
        continue-on-error: true
        run: |
          pip install mypy
          mypy --ignore-missing-imports --no-strict-optional shared gateway || true

  docker-image-scan:
    runs-on: ubuntu-latest
    # 諮詢性，理由同 dependency-audit：base image 的 CVE 多半要等上游出新版，
    # 擋下部署也修不掉。看得到報告就能決定何時換 digest。
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Build gateway image
        # 建置脈絡是 repo 根目錄：Dockerfile 裡是 `COPY gateway/ai_gateway.py .`，
        # 從 gateway/ 底下建會找不到 shared/ 的那幾個檔。
        run: docker build -f gateway/Dockerfile -t dm-gateway:ci .
      - name: Scan gateway image
        # 直接用官方安裝腳本裝 Trivy，不走 marketplace action——那個 action 會在內部
        # 引用一個已被移除的 setup-trivy tag，版本解析每隔一陣子就壞一次。
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin
          trivy image --severity HIGH,CRITICAL --ignore-unfixed --no-progress dm-gateway:ci

  dependency-audit:
    runs-on: ubuntu-latest
    # 諮詢性：回報已鎖版本裡的已知漏洞，但不擋部署——學生專案期間避免被
    # 無法立即修的傳遞相依 CVE 卡死；看到報告再決定要不要升版。
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Audit pinned dependencies for known CVEs
        run: |
          python -m pip install --upgrade pip pip-audit
          pip-audit -r gateway/requirements.txt -r render/requirements.txt || true
          pip-audit -r gateway/requirements.txt -r render/requirements.txt --strict

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reject tunnels / upstream keys in deployable code
        run: |
          # 只掃會被部署的程式與設定（.py/.js/.json/.html）；歷史文件(.md)裡的舊
          # Tunnel 網址是紀錄，不是活的秘密。.env 本就不進版控。
          if git grep -nEI 'https://[A-Za-z0-9-]+\.trycloudflare\.com|(faceApiKey|renderApiKey|textSuggestionApiKey)\s*[:=]' -- '*.py' '*.js' '*.json' '*.html' ; then
            echo "::error::Deployable code contains a temporary tunnel URL or an upstream key field."
            exit 1
          fi
          echo "No tunnel URLs or upstream key fields in deployable code."
