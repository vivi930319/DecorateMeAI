<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>進場動畫 · 變體比較 · 裝識你的美</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400&family=Noto+Serif+TC:wght@300;400;500;700&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{ box-sizing:border-box; margin:0; padding:0; }
:root{
    --ink:#241614; --ink-2:#301F1B; --ivory:#F3E2DB; --paper:#FBF1EC;
    --gold:#C58A74; --gold-lt:#E8BCA7; --gold-deep:#A86B56; --gold-soft:#DCA994;
    --gold-dim:rgba(197,138,116,0.32);
    --gold-grad:linear-gradient(100deg,#A86B56 0%,#E8BCA7 32%,#F9E2D6 50%,#E8BCA7 68%,#A86B56 100%);
    --serif:'Playfair Display','Noto Serif TC',serif;
    --cjk:'Noto Serif TC','Playfair Display',serif;
    --sans:'Jost','Noto Sans TC',sans-serif;
    --ease:cubic-bezier(.22,.61,.36,1);
}
html,body{ background:var(--ivory); }
body{ font-family:var(--cjk); color:#211B12; min-height:100vh; -webkit-font-smoothing:antialiased; padding:48px 40px 70px; }
.eyebrow{ font-family:var(--sans); font-weight:300; font-size:11px; letter-spacing:.42em; text-transform:uppercase; color:var(--gold-deep); }

.lede{ max-width:1180px; margin:0 auto 40px; }
.lede .eyebrow{ display:block; margin-bottom:14px; }
.lede h1{ font-family:var(--cjk); font-size:34px; font-weight:500; letter-spacing:.05em; }
.lede h1 .en{ font-family:var(--serif); font-style:italic; font-weight:400; color:var(--gold-deep); }
.lede .rule{ width:46px; height:1px; background:var(--gold); margin:16px 0; }
.lede p{ font-size:14px; color:#857762; font-weight:300; max-width:640px; line-height:1.7; }

.grid{ max-width:1180px; margin:0 auto; display:grid; grid-template-columns:repeat(3,1fr); gap:26px; }
@media (max-width:1080px){ .grid{ grid-template-columns:1fr; max-width:560px; } }

.variant{ display:flex; flex-direction:column; }
.v-head{ display:flex; align-items:baseline; justify-content:space-between; margin-bottom:14px; }
.v-no{ font-family:var(--serif); font-style:italic; font-size:22px; color:var(--gold); }
.v-title{ font-family:var(--cjk); font-size:17px; font-weight:500; letter-spacing:.08em; }
.v-tag{ font-family:var(--sans); font-size:10px; letter-spacing:.2em; text-transform:uppercase; color:#B2A693; }

.stage{
    position:relative; aspect-ratio:4/5; background:var(--ink); overflow:hidden;
    border:1px solid rgba(232,188,167,0.18); cursor:pointer;
}
.stage::before,.stage::after{ content:''; position:absolute; width:16px; height:16px; border:1px solid var(--gold-dim); z-index:6; }
.stage::before{ top:12px; left:12px; border-right:none; border-bottom:none; }
.stage::after{ bottom:12px; right:12px; border-left:none; border-top:none; }
.stage .center{ position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; }
.brand{ font-family:var(--cjk); font-size:clamp(26px,4.4vw,40px); font-weight:500; letter-spacing:.14em; display:flex; }
.brand .ch{
    display:inline-block;
    background:var(--gold-grad); background-size:300% 100%;
    -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent; color:transparent;
}
.sub{ font-family:var(--sans); font-size:9px; letter-spacing:.5em; text-transform:uppercase; color:var(--gold-soft); margin-top:18px; }
.rule-line{ height:1px; background:var(--gold-dim); margin-top:18px; width:0; }
.haze{ position:absolute; width:160%; height:160%; top:50%; left:50%; transform:translate(-50%,-50%);
    background:radial-gradient(circle, rgba(197,138,116,0.14) 0%, transparent 52%); opacity:0; }

.replay{
    margin-top:6px; display:flex; align-items:center; justify-content:center; gap:9px;
    position:absolute; inset:auto 0 0 0; padding:11px; background:rgba(11,10,8,0.55);
    font-family:var(--sans); font-size:10.5px; letter-spacing:.26em; text-transform:uppercase; color:var(--gold-soft);
    opacity:0; transition:opacity .3s var(--ease); z-index:7;
}
.stage:hover .replay{ opacity:1; }
.replay svg{ width:13px; height:13px; }

.choose{
    margin-top:14px; width:100%; background:var(--ink); color:var(--gold-lt);
    background-image:var(--gold-grad); background-repeat:no-repeat; background-position:left center; background-size:0% 100%;
    border:1px solid var(--gold); padding:13px; font-family:var(--sans); font-size:11px;
    letter-spacing:.26em; text-transform:uppercase; cursor:pointer;
    transition:background-size .5s var(--ease), color .45s var(--ease);
}
.choose:hover{ color:var(--ink); background-size:100% 100%; }
.note{ margin-top:11px; font-family:var(--sans); font-size:11px; letter-spacing:.06em; color:#9A8C76; text-align:center; min-height:16px; }

/* ───────── Variant A · 字母逐一浮現 + 流光掃過 ───────── */
/* 基準態：可見。動畫用 backwards 填充：延遲期間隱藏，播完回到可見基準態 */
.va .haze.run{ animation:hazeIn 2.2s var(--ease) .2s forwards; }
.va.run .ch{ animation:chRise .85s var(--ease) backwards; }
.va.run .ch:nth-child(1){ animation-delay:.25s; }
.va.run .ch:nth-child(2){ animation-delay:.40s; }
.va.run .ch:nth-child(3){ animation-delay:.55s; }
.va.run .ch:nth-child(4){ animation-delay:.70s; }
.va.run .ch:nth-child(5){ animation-delay:.85s; }
@keyframes chRise{ from{ opacity:0; transform:translateY(45%); } to{ opacity:1; transform:none; } }
.va .sweep{ position:absolute; top:0; bottom:0; left:-40%; width:26%; pointer-events:none; opacity:0;
    background:linear-gradient(100deg,transparent,rgba(255,240,232,0.6),transparent); transform:skewX(-16deg); }
.va.run .sweep{ animation:sweepX 1.2s var(--ease) 1.25s; }
@keyframes sweepX{ 0%{ left:-40%; opacity:1; } 100%{ left:130%; opacity:0; } }
.va .sub{ opacity:1; }
.va.run .sub{ animation:fadeUp 1s var(--ease) 1.7s backwards; }
.va .rule-line{ width:54%; }
.va.run .rule-line{ animation:ruleGrow 1.1s var(--ease) 1.45s backwards; }

/* ───────── Variant B · 金箔光澤橫掃揭字 ───────── */
/* 基準態：字已揭曉、遮罩已移開。run 時用 backwards 重演覆蓋→揭開 */
.vb .brand{ position:relative; }
.vb .mask{ position:absolute; inset:0; background:var(--ink); z-index:3; transform:translateX(101%); }
.vb.run .mask{ animation:wipe 1.4s var(--ease) .35s backwards; }
@keyframes wipe{ from{ transform:translateX(0); } to{ transform:translateX(101%); } }
.vb .glint{ position:absolute; top:0; bottom:0; width:3px; left:0; z-index:4; opacity:0;
    background:linear-gradient(180deg,transparent,rgba(255,240,232,0.95),transparent); box-shadow:0 0 18px 5px rgba(232,188,167,0.55); }
.vb.run .glint{ animation:glintMove 1.4s var(--ease) .35s; }
@keyframes glintMove{ 0%{ left:0; opacity:1; } 95%{ opacity:1; } 100%{ left:100%; opacity:0; } }
.vb .haze.run{ animation:hazeIn 2s var(--ease) .5s forwards; }
.vb .sub{ opacity:1; }
.vb.run .sub{ animation:fadeUp 1s var(--ease) 1.7s backwards; }
.vb .rule-line{ width:54%; }
.vb.run .rule-line{ animation:ruleGrow 1s var(--ease) 1.5s backwards; }

/* ───────── Variant C · 細線展開 + 字淡入 + 粒子微光 ───────── */
.vc .topline,.vc .botline{ position:absolute; left:50%; transform:translateX(-50%); height:1px; width:62%; background:var(--gold-dim); }
.vc .topline{ top:30%; } .vc .botline{ bottom:30%; }
.vc.run .topline{ animation:lineWide 1.1s var(--ease) .25s backwards; }
.vc.run .botline{ animation:lineWide 1.1s var(--ease) .35s backwards; }
@keyframes lineWide{ from{ width:0; } to{ width:62%; } }
.vc .brand .ch{ opacity:1; }
.vc.run .brand .ch{ animation:focusIn 1s var(--ease) backwards; }
.vc.run .brand .ch:nth-child(1){ animation-delay:.7s; }
.vc.run .brand .ch:nth-child(2){ animation-delay:.8s; }
.vc.run .brand .ch:nth-child(3){ animation-delay:.9s; }
.vc.run .brand .ch:nth-child(4){ animation-delay:1.0s; }
.vc.run .brand .ch:nth-child(5){ animation-delay:1.1s; }
@keyframes focusIn{ from{ opacity:0; filter:blur(6px); transform:translateY(8px); } to{ opacity:1; filter:blur(0); transform:none; } }
.vc .spark{ position:absolute; width:3px; height:3px; border-radius:50%; background:var(--gold-lt); opacity:0;
    box-shadow:0 0 8px 2px rgba(232,188,167,0.7); }
.vc.run .spark{ animation:sparkle 2.4s var(--ease) infinite; }
.vc .spark:nth-child(1){ top:34%; left:24%; animation-delay:1.2s !important; }
.vc .spark:nth-child(2){ top:62%; left:72%; animation-delay:1.6s !important; }
.vc .spark:nth-child(3){ top:46%; left:84%; animation-delay:2.0s !important; }
.vc .spark:nth-child(4){ top:66%; left:30%; animation-delay:1.9s !important; }
@keyframes sparkle{ 0%,100%{ opacity:0; transform:scale(.5); } 18%{ opacity:1; transform:scale(1); } 40%{ opacity:0; } }
.vc .sub{ opacity:1; }
.vc.run .sub{ animation:fadeUp 1.1s var(--ease) 1.6s backwards; }

/* shared keyframes */
@keyframes hazeIn{ to{ opacity:1; } }
@keyframes fadeUp{ from{ opacity:0; transform:translateY(8px); } to{ opacity:1; transform:none; } }
@keyframes ruleGrow{ to{ width:54%; } }

@media (prefers-reduced-motion:reduce){
    .stage *{ animation:none !important; }
    .brand .ch{ opacity:1 !important; transform:none !important; filter:none !important; }
    .vb .mask{ display:none; } .sub{ opacity:1 !important; } .rule-line{ width:54% !important; }
}
</style>
</head>
<body>

<div class="lede">
    <span class="eyebrow">Decorate Me · Entrance Study</span>
    <h1>進場動畫 <span class="en">— three openings</span></h1>
    <div class="rule"></div>
    <p>三種「閃動進場」方向，皆以墨黑 × 香檳金為基調。滑入任一畫面可重播，點「選擇此進場」告訴我你偏好哪一種，我便將它接進網站的開場。</p>
    <p style="margin-top:14px;"><a href="index.html" style="font-family:var(--sans);font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--gold-deep);text-decoration:none;border-bottom:1px solid var(--gold-dim);padding-bottom:3px;">← 回到網站</a></p>
</div>

<div class="grid">

    <!-- A -->
    <div class="variant">
        <div class="v-head"><div><span class="v-no">01</span></div><div class="v-tag">Reveal</div></div>
        <div class="v-title" style="margin:-6px 0 12px;">字母浮現 · 流光掃過</div>
        <div class="stage va" data-variant="A">
            <div class="haze"></div>
            <div class="center">
                <div class="brand"><span class="ch">裝</span><span class="ch">飾</span><span class="ch">你</span><span class="ch">的</span><span class="ch">美</span></div>
                <div class="rule-line"></div>
                <div class="sub">Decorate Me</div>
            </div>
            <div class="sweep"></div>
            <div class="replay"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M21 12a9 9 0 1 1-3-6.7M21 4v5h-5"/></svg>重播</div>
        </div>
        <button class="choose" data-pick="A">選擇此進場</button>
        <div class="note" data-note="A"></div>
    </div>

    <!-- B -->
    <div class="variant">
        <div class="v-head"><div><span class="v-no">02</span></div><div class="v-tag">Foil Wipe</div></div>
        <div class="v-title" style="margin:-6px 0 12px;">金箔光澤 · 橫掃揭字</div>
        <div class="stage vb" data-variant="B">
            <div class="haze"></div>
            <div class="center">
                <div class="brand"><span class="ch">裝</span><span class="ch">飾</span><span class="ch">你</span><span class="ch">的</span><span class="ch">美</span><div class="mask"></div></div>
                <div class="rule-line"></div>
                <div class="sub">Decorate Me</div>
            </div>
            <div class="glint"></div>
            <div class="replay"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M21 12a9 9 0 1 1-3-6.7M21 4v5h-5"/></svg>重播</div>
        </div>
        <button class="choose" data-pick="B">選擇此進場</button>
        <div class="note" data-note="B"></div>
    </div>

    <!-- C -->
    <div class="variant">
        <div class="v-head"><div><span class="v-no">03</span></div><div class="v-tag">Atelier</div></div>
        <div class="v-title" style="margin:-6px 0 12px;">細線展開 · 對焦微光</div>
        <div class="stage vc" data-variant="C">
            <div class="haze"></div>
            <div class="topline"></div><div class="botline"></div>
            <div class="spark"></div><div class="spark"></div><div class="spark"></div><div class="spark"></div>
            <div class="center">
                <div class="brand"><span class="ch">裝</span><span class="ch">飾</span><span class="ch">你</span><span class="ch">的</span><span class="ch">美</span></div>
                <div class="sub" style="margin-top:26px;">Decorate Me</div>
            </div>
            <div class="replay"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M21 12a9 9 0 1 1-3-6.7M21 4v5h-5"/></svg>重播</div>
        </div>
        <button class="choose" data-pick="C">選擇此進場</button>
        <div class="note" data-note="C"></div>
    </div>

</div>

<script>
function play(stage){
    stage.classList.remove('run');
    stage.querySelectorAll('.haze').forEach(h=>h.classList.remove('run'));
    void stage.offsetWidth;
    stage.classList.add('run');
    stage.querySelectorAll('.haze').forEach(h=>h.classList.add('run'));
}
document.querySelectorAll('.stage').forEach(stage=>{
    play(stage);
    stage.addEventListener('click', ()=> play(stage));
});
document.querySelectorAll('.choose').forEach(btn=>{
    btn.addEventListener('click', ()=>{
        const pick = btn.dataset.pick;
        document.querySelectorAll('.note').forEach(n=>n.textContent='');
        const note = document.querySelector('.note[data-note="'+pick+'"]');
        note.textContent = '已標記 — 告訴我「用 0'+ (pick==='A'?'1':pick==='B'?'2':'3') +'」，我就接進站內開場';
        note.style.color = 'var(--gold-deep)';
    });
});
</script>
</body>
</html>
