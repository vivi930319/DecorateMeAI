[pytest]
# 測試搬進 tests/ 之後，被測模組還在根目錄，所以要把根目錄加進 import 路徑。
# 需要 pytest >= 7.0。
# 服務碼分在各自的資料夾，但容器內是扁平的（Dockerfile 用 COPY face/x.py .），
# 所以 import 寫法維持 `import job_store` 不變。本機測試要靠這行把各資料夾
# 都加進 sys.path，才能重現容器裡的那個扁平命名空間。
pythonpath = . face gateway render shared suggestion
testpaths = tests
python_files = *_test.py
addopts = -q --strict-markers
filterwarnings =
    # FastAPI 的 on_event 已棄用，但改用 lifespan 是另一件事。
    # 這行只是不要讓 7 條重複警告淹掉真正該看的輸出。
    ignore::DeprecationWarning:fastapi.*
    ignore::DeprecationWarning:starlette.*
